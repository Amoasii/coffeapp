<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аппараты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#ffffff;--text:#1c1b1f;--hint:#79767f;--accent:#2a7ae2}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--text:#e6e1e9;--hint:#948f99;--accent:#5ea2ef}}
body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:0 16px;box-sizing:border-box}
p{color:var(--hint);margin:8px 0 20px}
body>div{width:100%;max-width:340px}
a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:12px}
</style>
</head>
<body>
<div>
<h2 style="margin:0">Дашборд переехал</h2>
<p>Аппараты, продажи и настройки теперь в приложении Vend Puls.</p>
<a id="go" href="https://t.me/VendPulsBot?startapp">Открыть Vend Puls</a>
</div>
<script>
// Старый дашборд выключен 22.10 (David): ведём в @VendPulsBot
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); document.getElementById('go').onclick = e => { e.preventDefault(); tg.openTelegramLink('https://t.me/VendPulsBot?startapp'); }; }
</script>
</body>
</html>
