<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vend Puls</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0;background:var(--tg-theme-bg-color,#fff)}</style>
</head>
<body>
<script>
// Старый дашборд выключен 22.10 (David): сразу открываем Vend Puls и закрываем это окно — без экранов и кнопок
const VP = 'https://t.me/VendPulsBot?startapp';
const tg = window.Telegram && Telegram.WebApp;
if (tg && tg.initData) { tg.openTelegramLink(VP); setTimeout(() => tg.close(), 300); }
else location.replace(VP);
</script>
</body>
</html>
